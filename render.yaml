databases:
  - name: intentos-db
    databaseName: intentos
    user: intentos
    plan: free

services:
  - type: redis
    name: intentos-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: intentos-backend
    plan: free
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne intentos.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: intentos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: intentos-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
